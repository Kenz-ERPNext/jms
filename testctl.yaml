# testctl config for the JMS app.
# Run from this directory: testctl run   (or /testctl:test-all)
# NOTE: point `site` at a TEST/restored site with allow_tests enabled — never live data.
stacks:
  frappe:
    benchPath: /Users/sammishthundiyil/frappe-bench-kenz
    site: oasis.local
    apps: [jms]
    # Scope to specific test modules — avoids the heavy ERPNext --app
    # test-record bootstrap that crashes on this restored site.
    modules:
      - jms.jms.doctype.job.test_job
